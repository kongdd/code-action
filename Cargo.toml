[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "app/src-tauri"]
exclude = ["crates/cli-remote"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
