[package]
name = "cli-remote"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "remote-editor"
path = "remote-editor.rs"

[[bin]]
name = "remote-open"
path = "remote-open.rs"
