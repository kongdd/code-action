[package]
name = "code-action-core"
version.workspace = true
description = "Code Action 的核心逻辑：历史记录、文件检索与打开动作"
edition.workspace = true
autotests = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "6"
url = "2"
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
